# TrenAvís servida desde Cloudflare en https://trenavis.lorennsw.workers.dev
# (dominio propio entero: necesario para que la app de Android (TWA) se abra sin barra del navegador).
name = "trenavis"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "26daaf7d50d86f84e8b2d985db7012a0"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Mismo KV que la API: aquí se guardan las huellas del certificado de la app Android (assetlinks)
[[kv_namespaces]]
binding = "DATA"
id = "c27f8eab03c845a0a0b1036c21aa1b72"
