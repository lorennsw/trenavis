<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Horarios, salidas y llegadas de Rodalies de Catalunya. App no oficial." />
  <meta name="theme-color" content="#1240e0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TrenAvís" />
  <title>TrenAvís · Rodalies de Catalunya</title>
  <script>try{var t=JSON.parse(localStorage.getItem('trenavis:theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <noscript>TrenAvís necesita JavaScript para funcionar.</noscript>
  <div id="splash" role="status" aria-label="Cargando TrenAvís">
    <img src="icon-splash.svg" alt="" width="112" height="112" />
    <b>TrenAvís</b>
    <span class="sp-sub">Rodalies de Catalunya</span>
    <span class="sp-dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
  <style>
    #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#1240e0;color:#fff;font-family:system-ui,sans-serif;transition:opacity .3s}
    #splash img{border-radius:28px;box-shadow:0 12px 40px rgb(0 0 0/.25)}
    #splash b{font-size:2rem;margin-top:14px;letter-spacing:-.01em}
    #splash .sp-sub{opacity:.85;font-size:.95rem}
    #splash .sp-dots{display:flex;gap:8px;margin-top:22px}
    #splash .sp-dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.35;animation:sp 1.2s infinite}
    #splash .sp-dots i:nth-child(2){animation-delay:.2s}#splash .sp-dots i:nth-child(3){animation-delay:.4s}
    #splash.hide{opacity:0;pointer-events:none}
    @keyframes sp{40%{opacity:1;transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){#splash .sp-dots i{animation:none;opacity:.8}#splash{transition:none}}
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
