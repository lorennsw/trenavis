name: Desplegar Worker y actualizar datos GTFS
on:
  schedule: [{ cron: '17 4 * * *' }]   # cada día a las 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main, ccr-678091cb-mlaxyu]
    paths: ['worker/**', 'tools/**', 'shared/**', '.github/workflows/update-data.yml']
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Base de datos D1
        id: d1
        run: bash tools/ensure-d1.sh
      - name: Desplegar Worker
        run: npx wrangler deploy --config worker/wrangler.toml
      - name: Clave de Firebase para las notificaciones de la app
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT --config worker/wrangler.toml
          else echo "Sin secreto FIREBASE_SERVICE_ACCOUNT: la app Android no recibirá notificaciones todavía."; fi
      - run: npm run data:build
      - name: Municipios de OpenStreetMap (guardados por el workflow mensual)
        run: npx tsx tools/apply-areas.ts
      - run: npm run data:quality
      - run: npx tsx tools/make-kv-bulk.ts
      - name: Subir datos al KV
        run: npx wrangler kv bulk put data/out/kv-bulk.json --binding DATA --config worker/wrangler.toml
      - name: Avisos – claves y planificación de alarmas
        if: steps.d1.outputs.d1 == 'yes'
        run: |
          TOKEN=$(npx tsx tools/ensure-secrets.ts)
          echo "::add-mask::$TOKEN"
          ADMIN_TOKEN="$TOKEN" npx tsx tools/plan-alarms.ts
