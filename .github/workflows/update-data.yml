name: Desplegar Worker y actualizar datos GTFS
on:
  schedule: [{ cron: '17 4 * * *' }]   # cada día a las 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main, ccr-678091cb-mlaxyu]
    paths: ['worker/**', 'tools/**', 'shared/**', '.github/workflows/update-data.yml']
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Desplegar Worker
        run: npx wrangler deploy --config worker/wrangler.toml
      - run: npm run data:build
      - run: npm run data:quality
      - run: npx tsx tools/make-kv-bulk.ts
      - name: Subir datos al KV
        run: npx wrangler kv bulk put data/out/kv-bulk.json --binding DATA --config worker/wrangler.toml --remote
