name: Redirección de la dirección antigua (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['tools/build-redirect.ts', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsx tools/build-redirect.ts dist-redirect
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-redirect }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
