name: App Android (APK y AAB)
on:
  workflow_dispatch:
  push:
    branches: [main, ccr-678091cb-mlaxyu]
    paths: ['tools/android/**', '.github/workflows/android.yml']
permissions:
  contents: write   # para publicar el APK/AAB en Releases
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - run: npm i --no-save @bubblewrap/core@1.28.0
      - name: Android SDK (build-tools que usa Bubblewrap)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" > /dev/null
      - name: Clave de firma
        run: bash tools/android/keystore.sh
      - name: Generar, compilar y firmar
        run: node tools/android/build-twa.mjs ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: trenavis-android-${{ github.run_number }}, path: android-out/ }
      - name: Publicar en Releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "android-1.0.${{ github.run_number }}" android-out/*.apk android-out/*.aab \
            --title "TrenAvís para Android 1.0.${{ github.run_number }}" --target "${{ github.sha }}" \
            --notes "APK para instalar directamente en Android (permite «instalar apps de origen desconocido»). AAB para subir a Google Play."
